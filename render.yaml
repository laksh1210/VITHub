services:
  - type: web
    name: vithub-backend
    env: docker
    rootDir: backend
    plan: free
    region: ohio
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: vithub-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: vithub-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: vithub-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: JWT_REFRESH_EXPIRATION
        value: 604800000
      - key: GEMINI_API_KEY
        value: "dummy-key-update-me-in-render-dashboard"
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # Allows frontend to connect
databases:
  - name: vithub-db
    plan: free
    region: ohio
    postgresMajorVersion: 15
